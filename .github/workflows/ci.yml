name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.11'

      - name: Install package
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check src tests

      - name: Pytest
        run: uv run pytest -q

  # The dashboard is built from source in the release image (frontend-builder
  # stage in the Dockerfile), so without this a broken frontend build would only
  # surface when a v*.*.* tag is pushed.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Matches the node:22-slim builder the release image uses.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` is `tsc && vite build`, so this typechecks too.
      - name: Build
        working-directory: frontend
        run: npm run build