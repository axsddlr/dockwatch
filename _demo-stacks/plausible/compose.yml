version: "3.8"

# Trimmed test copy for dockwatch integration testing — cloudflared removed
# (no real tunnel token available), hexportal-plausible network made local.

networks:
  plausible-internal:
    driver: bridge
  hexportal-plausible:
    driver: bridge

volumes:
  db_data:
  clickhouse_data:
  clickhouse_logs:
  app_data:

services:
  plausible_db:
    image: postgres:${POSTGRES_TAG}
    container_name: plausible-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - plausible-internal
      - hexportal-plausible

  plausible_events_db:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_TAG}
    container_name: plausible-events-db
    restart: unless-stopped
    expose:
      - "8123"
      - "9000"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - plausible-internal

  plausible:
    image: ghcr.io/plausible/community-edition:${PLAUSIBLE_TAG}
    container_name: plausible
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    ports:
      - "8000:8000"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    volumes:
      - app_data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TMPDIR=/var/lib/plausible/tmp
      - BASE_URL=${BASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - TOTP_VAULT_KEY=${TOTP_VAULT_KEY}
      - HTTP_PORT=${HTTP_PORT}
      - DISABLE_REGISTRATION=${DISABLE_REGISTRATION}
      - ENABLE_EMAIL_VERIFICATION=${ENABLE_EMAIL_VERIFICATION}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plausible_db:5432/${POSTGRES_DB}
      - CLICKHOUSE_DATABASE_URL=http://plausible_events_db:8123/plausible_events_db
    networks:
      - plausible-internal
      - hexportal-plausible
