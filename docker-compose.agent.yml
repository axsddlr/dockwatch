# Example: run a dockwatch AGENT on another Docker PC so a central dockwatch
# instance can see and manage this host's containers.
#
#   cp .env.agent.example .env
#   # edit .env: paste a generated token (Settings -> Agents -> Generate on
#   # the central instance, or `openssl rand -hex 32`) into DOCKWATCH_AGENT_TOKEN
#   docker compose -f docker-compose.agent.yml up -d
#
# Put the same token value in the central instance's Settings -> Agents
# (name/url/token). Keeping it in .env (gitignored) instead of this file
# avoids accidentally committing a real token.
#
# The agent is stateless: no config volume, no dashboard. The token grants
# full Docker control on this host — only expose it on networks you trust
# (LAN/VPN/Tailscale or a TLS reverse proxy).

services:
  dockwatch-agent:
    image: ghcr.io/axsddlr/dockwatch:latest
    container_name: dockwatch-agent
    restart: unless-stopped
    environment:
      - DOCKWATCH_AGENT_TOKEN=${DOCKWATCH_AGENT_TOKEN:?set DOCKWATCH_AGENT_TOKEN in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8081:8081"
    command: ["dockwatch", "agent", "--host", "0.0.0.0", "--port", "8081"]
