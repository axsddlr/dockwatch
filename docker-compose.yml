services:
  dockwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockwatch-local:dev
    pull_policy: never
    container_name: dockwatch
    restart: unless-stopped
    command: ["dockwatch", "serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockwatch_config:/home/appuser/.config/dockwatch
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
    init: true

  dockwatch-dev-api:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    image: dockwatch-local:dev
    pull_policy: never
    container_name: dockwatch-dev-api
    restart: unless-stopped
    ports:
      - "18080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockwatch_config:/home/appuser/.config/dockwatch
    command: ["dockwatch", "serve", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1G"
    init: true

  dockwatch-dev-frontend:
    profiles: ["dev"]
    image: node:22-slim
    container_name: dockwatch-dev-frontend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - dockwatch_frontend_node_modules:/app/node_modules
    environment:
      - DOCKWATCH_API_PROXY_TARGET=http://dockwatch-dev-api:8080
      - DOCKWATCH_WS_PROXY_TARGET=ws://dockwatch-dev-api:8080
    depends_on:
      - dockwatch-dev-api
    init: true

volumes:
  dockwatch_config:
  dockwatch_frontend_node_modules:
