services:
  dockwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockwatch:local
    container_name: dockwatch
    restart: unless-stopped
    command: ["dockwatch", "serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockwatch_config:/root/.config/dockwatch

volumes:
  dockwatch_config:
