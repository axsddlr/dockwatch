[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "dockwatch"
version = "0.9.2"
description = "Docker container update watcher with CLI and web dashboard"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "docker>=7.1.0",
  "httpx>=0.27.0",
  "rich>=13.7.1",
  "packaging>=24.1",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "itsdangerous>=2.1.2",
]

[project.scripts]
dockwatch = "dockwatch.main:app"

[dependency-groups]
dev = [
  "ruff==0.15.7",
  "mypy==1.19.1",
  "pytest==8.3.3",
  "pytest-asyncio==0.25.3",
  "types-docker>=7.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dockwatch"]
