[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "dockwatch"
version = "0.13.0"
description = "Docker container update watcher with CLI and web dashboard"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.27.2",
  "docker>=7.2.0",
  "httpx>=0.27.0",
  "rich>=13.7.1",
  "packaging>=26.3",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
  "itsdangerous>=2.1.2",
]

[project.scripts]
dockwatch = "dockwatch.main:app"

[dependency-groups]
dev = [
  # Exact pins are fine for tools that stand alone: Dependabot can bump them and
  # CI catches any fallout (see the ruff 0.16 bump).
  "ruff==0.16.6",
  "mypy==2.3.1",
  # pytest and pytest-asyncio constrain each other — pytest-asyncio caps the
  # pytest major it supports — so exact pins make each one unupdatable: bumping
  # either alone leaves the other unsatisfiable and Dependabot reports
  # dependency_file_not_resolvable. Lower bounds let the resolver co-upgrade the
  # pair; uv.lock still pins the exact versions CI installs.
  "pytest>=8.3.3",
  "pytest-asyncio>=0.25.3",
  "types-docker>=7.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dockwatch"]

[tool.ruff]
# Pin the target so a ruff bump cannot silently change which modernizations are
# applied. Without this, ruff infers it from requires-python.
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls in argument defaults by design
# (e.g. `user: User = Depends(require_permission("containers", "write"))`), so
# B008 is a false positive for these callables. Rewriting the routes to call
# them inside the body would break the dependency-injection contract.
extend-immutable-calls = [
  "fastapi.Depends",
  "dockwatch.api.security.require_permission",
]
